[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ca"
version = "1.0.0"
description = "Agentic AI Chartered Accountant RAG System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.0.0",
    "duckdb>=0.10.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "qdrant-client>=1.7.0",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "redis>=5.0.0",
    "pyzmq>=25.0.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "sqlparse>=0.4.4",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]
llm-google = ["langchain-google-genai>=1.0.0"]
llm-groq = ["langchain-groq>=0.1.0"]
llm-openai = ["langchain-openai>=0.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
