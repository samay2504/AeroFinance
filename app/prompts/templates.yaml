# AI-CA Prompt Templates - Production Grade v3.0
# Enhanced with token management, dynamic context, and senior prompt engineering
# 
# Features:
# - Token-efficient prompts
# - Dynamic variable injection
# - Semantic understanding focus
# - Rate limit protection via concise outputs

# Global settings
settings:
  version: "3.0"
  default_currency: "INR"
  precision: 2
  strict_mode: true
  # Token management settings
  token_management:
    enable_chunking: true
    max_data_sample_tokens: 2000
    max_schema_tokens: 500
    summarize_large_outputs: true

# Available tools for agent reference
tools:
  - name: web_search
    description: "Multi-provider web search for real-time information"
    use_for: "tax rates, regulations, market data, latest news"
  - name: search_tax_rate
    description: "Specialized tax rate lookup from official sources"
    use_for: "GST rates, Income Tax, TDS, Corporate Tax"
  - name: benford_test
    description: "Benford's Law fraud detection on numeric data"
    use_for: "expense analysis, ledger scrutiny, fraud detection"
  - name: cohort_analysis
    description: "Customer retention and cohort analysis"
    use_for: "customer lifetime value, churn analysis"

templates:
  # ============================================================================
  # ROUTER - Fast Intent Classification (Token-Optimized)
  # ============================================================================
  router: |
    {guardrails}

    CONTEXT: {context}
    QUERY: {query}

    CLASSIFY into ONE track:

    TRACK_DATA: Data analysis, calculations, metrics, trends, aggregations, comparisons on loaded datasets
    TRACK_DOC: Policy lookup, contracts, clauses, compliance text from documents
    TRACK_WEB: Real-time info, current rates, latest news, external data

    PRIORITY: If data loaded + query relates to analysis → TRACK_DATA
    
    OUTPUT: Return ONLY: TRACK_DATA, TRACK_DOC, or TRACK_WEB

  # ============================================================================
  # SQL GENERATION - Production Grade (Token-Efficient)
  # ============================================================================
  data_analyst_sql: |
    {guardrails}

    SCHEMA (DuckDB):
    {schema}
    {columns_section}
    {data_sample_section}
    {semantic_section}

    SQL RULES:
    1. Use EXACT column names from schema (lowercase, underscores)
    2. Numeric ops: CAST(col AS DOUBLE) or TRY_CAST
    3. Text matching: LOWER() for case-insensitive
    4. Use COALESCE(col, 0) for NULL safety
    5. NO backticks - DuckDB uses "quotes"

    PATTERNS:
    - Growth: (new - old) or ((new - old)/old * 100)
    - Lookup: WHERE LOWER(label) LIKE '%term%'
    - Aggregation: SUM(CAST(col AS DOUBLE))

    QUERY: {query}

    OUTPUT JSON:
    {{"sql": "SELECT ...", "columns_used": [], "explanation": ""}}

  # ============================================================================
  # PYTHON CODE GENERATION (Token-Efficient)
  # ============================================================================
  data_analyst_python: |
    {guardrails}

    SCHEMA: {schema}
    SAMPLE: {sample}
    QUERY: {query}

    Generate Python:
    1. Function: def run(df) -> result
    2. Modules available: pd, np, math, datetime (NO imports needed)
    3. Return: JSON-serializable (dict, list, number, string)
    4. Handle NaN: pd.notna(), fillna()

    BLOCKED: __import__, exec, eval, open, os, sys, subprocess

    OUTPUT JSON:
    {{"code": "def run(df):\n    ...\n    return result", "explanation": ""}}

  # ============================================================================
  # SCHEMA ANALYSIS - Data Understanding
  # ============================================================================
  schema_analysis: |
    Analyze DataFrame structure:

    INFO:
    - Shape: {shape}
    - Columns: {columns}
    - Sample:
    {sample_data}

    IDENTIFY:
    1. LABEL_COLUMN: Row labels/metric names column
    2. PERIOD_COLUMNS: Time period columns → map to normalized form (fy21, q1fy23, 9mfy22)
    3. HEADER_ROW: Row index with headers (0 if parsed)
    4. DATA_TYPE: income_statement, balance_sheet, cashflow, mis_report, ledger

    OUTPUT JSON:
    {{"label_column": "", "period_columns": {{}}, "header_row": 0, "data_type": ""}}

  # ============================================================================
  # SYNTHESIS - Professional CA Response
  # ============================================================================
  synthesis: |
    {guardrails}

    RESULTS ({method}): {results}
    QUERY: {query}

    SYNTHESIZE:
    1. Lead with direct answer
    2. Format numbers: 2 decimals, INR Mn/Cr/Lakhs
    3. Explain variance significance if applicable
    4. Note methodology
    5. Add disclaimer if uncertain

    OUTPUT: Clear, professional management-ready response.

  # ============================================================================
  # DOCUMENT RAG - Policy Lookup
  # ============================================================================
  document_rag: |
    {guardrails}

    CONTEXT: {context}
    QUERY: {query}

    RULES:
    1. Answer ONLY from context
    2. Quote relevant sections: "..."
    3. If not found: "Information not found in available documents"
    4. Cite clause/section numbers
    5. Recommend verification for legal matters

    OUTPUT: Accurate answer with source references.

  # ============================================================================
  # WEB SEARCH - Real-Time Info
  # ============================================================================
  web_search: |
    {guardrails}

    RESULTS ({provider}): {results}
    QUERY: {query}

    SYNTHESIZE:
    1. Prioritize: government > established publications
    2. Cite sources: [Name](URL)
    3. Note date relevance
    4. Flag outdated info
    5. Add verification disclaimer for tax/regulations

    OUTPUT: Factual answer with sources.

  # ============================================================================
  # DATASET MATCHING - Semantic Selection
  # ============================================================================
  dataset_match: |
    Match query to best dataset.

    DATASETS: {datasets}
    QUERY: {query}

    MATCH BY:
    1. Keywords in query → column/sheet names
    2. Time periods (FY21, 9MFY22) → matching dataset
    3. Metric types → statement type (income, balance, cashflow)

    OUTPUT: dataset_id or "NONE"

  # ============================================================================
  # METADATA QUERY - Structure Questions
  # ============================================================================
  metadata_query: |
    Determine if query is about data STRUCTURE (metadata) vs VALUES (analysis).

    AVAILABLE DATA: {datasets}
    {schema_section}
    QUERY: "{query}"

    METADATA (structure): sheet count, sheet names, column list, schema
    → Answer directly with complete info

    DATA (values): summary, calculate, analyze, show data, compare
    → Return is_metadata_query: false

    OUTPUT JSON:
    {{"is_metadata_query": true/false, "answer": "", "confidence": 0.95}}

  # ============================================================================
  # FRAUD ANALYSIS - Benford's Law
  # ============================================================================
  fraud_analysis: |
    {guardrails}

    BENFORD TEST RESULTS: {results}
    COLUMN: {column}
    DATASET: {dataset}

    INTERPRET:
    - PASS: Normal distribution, no red flags
    - WARNING: Minor deviations, monitor
    - FAIL: Significant anomaly, investigate

    FOR FAILURES:
    - Identify deviating digits
    - Suggest investigation areas
    - Recommend audit procedures

    OUTPUT: Audit-ready fraud analysis report.

  # ============================================================================
  # RECONCILIATION - Three-Way Match
  # ============================================================================
  reconciliation: |
    {guardrails}

    THREE-WAY MATCH: {results}

    SUMMARIZE:
    - Matched: Invoice/PO/Ledger agree
    - Unmatched: Discrepancies found

    FOR DISCREPANCIES:
    1. Categorize: price/quantity/timing variance
    2. Quantify impact
    3. Resolution steps
    4. Flag for management

    OUTPUT: CFO-ready reconciliation report.

  # ============================================================================
  # TOOL SELECTION - Dynamic Tool Choice
  # ============================================================================
  tool_selection: |
    {guardrails}

    QUERY: {query}

    TOOLS:
    - web_search: real-time info, tax rates, market data
    - search_tax_rate: GST, Income Tax, TDS, Corporate Tax
    - search_regulation: compliance, regulatory requirements
    - benford_test: fraud detection (needs dataset_id, column)
    - cohort_analysis: retention analysis (needs dataset_id, date_col, user_col)
    - three_way_match: reconciliation (needs 3 dataset_ids)
    - null: pure data query, no tool needed

    OUTPUT JSON:
    {{"tool": "name or null", "parameters": {{}}, "reason": ""}}

  # ============================================================================
  # CONVERSATION CONTEXT - Memory Summarization
  # ============================================================================
  conversation_summary: |
    Summarize conversation for context continuity.

    HISTORY:
    {history}

    CURRENT QUERY: {query}

    EXTRACT:
    1. Key topics discussed
    2. Important values/findings
    3. User preferences identified
    4. Pending questions

    OUTPUT: Concise context summary (max 200 words).

  # ============================================================================
  # DATASET SUMMARY - Human-readable overview of uploaded data
  # ============================================================================
  dataset_summary: |
    {guardrails}

    You are analyzing an uploaded data file for a client. Generate a professional summary.

    FILE INFORMATION:
    - File Name: {file_name}
    - Dataset ID: {dataset_id}
    - Sheet Names: {sheet_names}
    - Total Rows: {total_rows}
    - Total Columns: {total_cols}
    - Top Columns: {top_columns}
    
    SAMPLE DATA (first 3 rows):
    {sample_rows}

    DETECTED METADATA:
    - Periods: {detected_periods}
    - Currency: {detected_currency}
    - Data Types: {detected_fact_types}

    INSTRUCTIONS:
    1. Write a 4-6 sentence overview describing what this dataset contains
    2. Identify the apparent purpose (MIS report, financial statement, ledger, etc.)
    3. List key columns/metrics with their apparent meaning
    4. Note any time periods or currencies detected
    5. Be factual - only describe what you observe in the data

    expected_output: final_text

    OUTPUT FORMAT:
    **Dataset Overview:**
    [4-6 sentences describing the data]

    **Key Fields Identified:**
    - [column_name]: [apparent meaning/mapping]
    - ...

    **VERIFICATION:** If you cannot determine something, state "Unable to determine from available data."

    I only use information from the uploaded data - I do not make assumptions about data that is not present.

  # ============================================================================
  # FINALIZER - Converts raw results to professional CA response
  # ============================================================================
  finalizer: |
    {guardrails}

    You are a Senior Chartered Accountant presenting analysis results to management.

    RAW COMPUTATION RESULTS:
    {results}

    ORIGINAL QUERY: {query}
    
    COMPUTATION METHOD: {method}
    PROVENANCE: {provenance}

    INSTRUCTIONS:
    1. Present the answer in complete sentences with professional CA tone
    2. Include the numeric result with appropriate precision (2 decimal places)
    3. Express amounts in INR with appropriate scale (Lakhs/Crores/Millions)
    4. Reference the data source (dataset/sheet/row-column where applicable)
    5. If computing growth/variance, show both values and the calculation
    6. Add a brief methodology note
    7. Include a CA disclaimer if the data is from uploaded documents

    expected_output: final_text

    OUTPUT FORMAT:
    [Main finding in 1-2 complete sentences with the numeric result]

    Methodology: [Brief description of how this was computed: SQL/Pandas/LLM]
    
    Sources:
    - [Dataset ID] | [Sheet/Table] | [Row/Column reference if applicable]

    ---
    *CA Disclaimer: This calculation uses data from uploaded documents only. Verify with source documents before use as audit evidence.*

  # ============================================================================
  # OUT OF DOMAIN - Response for non-CA queries
  # ============================================================================
  out_of_domain: |
    I am an AI Chartered Accountant assistant focused on document-based accounting and finance queries.
    
    I can help you with:
    - Analyzing uploaded financial data (Excel, CSV files)
    - Financial calculations (variances, growth rates, aggregations)
    - Looking up information in uploaded documents
    - Tax rate and compliance queries
    
    For general conversation or non-finance topics, please use a general-purpose assistant.

# Validation rules for prompt outputs
validation:
  sql_response:
    required_fields: ["sql", "columns_used", "explanation"]
    sql_must_contain: ["SELECT", "FROM"]
    sql_must_not_contain: ["`", "DROP", "DELETE", "UPDATE", "INSERT", "ALTER"]
  
  python_response:
    required_fields: ["code", "explanation"]
    code_must_contain: ["def run(df):", "return"]
    code_must_not_contain: ["__import__", "exec", "eval", "open(", "os.", "sys."]

  schema_analysis:
    required_fields: ["label_column", "period_columns", "header_row"]

  metadata_response:
    required_fields: ["is_metadata_query", "answer", "confidence"]

# Security blocked patterns
blocked_patterns:
  - "__import__"
  - "exec("
  - "eval("
  - "compile("
  - "open("
  - "os.system"
  - "subprocess"
  - "requests."
  - "urllib"
  - "socket"
  - "pickle"
