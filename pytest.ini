[pytest]
# Custom markers for test categorization
markers =
    integration: Integration tests that require external services (LLM, Redis, etc.)
    slow: Tests that take longer than 10 seconds
    llm: Tests that make real LLM API calls

# Default options
addopts = -v --tb=short

# Test file patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Ignore patterns
norecursedirs = .git .venv __pycache__ node_modules data artifacts

# Async mode (for async tests - requires pytest-asyncio if used)
# asyncio_mode = auto

